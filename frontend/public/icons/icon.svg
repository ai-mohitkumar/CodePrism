<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1020"/>
      <stop offset="50%" stop-color="#12182B"/>
      <stop offset="100%" stop-color="#060913"/>
    </linearGradient>
    <linearGradient id="prismGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="35%" stop-color="#3B82F6"/>
      <stop offset="70%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#8B5CF6" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background Rounded Rect -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="url(#prismGrad)" stroke-width="4" stroke-opacity="0.5"/>

  <!-- Glow effect -->
  <circle cx="256" cy="240" r="160" fill="url(#glowGrad)"/>

  <!-- CodePrism Crystal / Prism Geometry -->
  <g filter="url(#shadow)">
    <!-- Main Prism Facets -->
    <polygon points="256,70 390,170 390,340 256,440 122,340 122,170" fill="none" stroke="url(#prismGrad)" stroke-width="12" stroke-linejoin="round"/>
    
    <!-- Inner Prism Triangle -->
    <polygon points="256,120 350,310 162,310" fill="url(#prismGrad)" fill-opacity="0.15" stroke="url(#prismGrad)" stroke-width="8" stroke-linejoin="round"/>
    
    <!-- Code Brackets <> inside Prism -->
    <path d="M 210 230 L 175 256 L 210 282" fill="none" stroke="#67E8F9" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 302 230 L 337 256 L 302 282" fill="none" stroke="#C084FC" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 270 215 L 242 297" fill="none" stroke="#34D399" stroke-width="8" stroke-linecap="round"/>
  </g>

  <!-- Sparkle Stars -->
  <circle cx="390" cy="120" r="8" fill="#F472B6"/>
  <circle cx="120" cy="380" r="6" fill="#38BDF8"/>
  <circle cx="410" cy="380" r="6" fill="#34D399"/>
</svg>
